<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Vendo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#01110a">
<!-- Cambia esta URL si el proyecto del panel tiene otro nombre en Cloudflare Pages. -->
<meta http-equiv="refresh" content="0; url=https://vendo-panel.pages.dev/">
<link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
<style>
  :root{--ink:#01110a;--lime:#cef17b;--cream:#f8ffe6;--mut:#a9c2a0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--cream);font:400 16px/1.6 "Space Mono",ui-monospace,monospace;padding:24px;text-align:center}
  .box{max-width:420px}
  .mark{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--lime);color:var(--ink);font:600 24px/1 "Fredoka",system-ui,sans-serif;margin:0 auto 18px}
  h1{font-family:"Fredoka",system-ui,sans-serif;font-size:22px;margin:0 0 8px}
  p{color:var(--mut);font-size:14px;margin:0 0 20px}
  a.btn{display:inline-block;background:var(--lime);color:var(--ink);text-decoration:none;font-weight:700;padding:13px 24px;border-radius:999px;font-family:"Fredoka",system-ui,sans-serif}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">V</div>
    <h1>Panel de administración</h1>
    <p>Te estamos redirigiendo al panel de Vendo…</p>
    <a class="btn" href="https://vendo-panel.pages.dev/">Entrar al panel</a>
  </div>
  <script>location.replace("https://vendo-panel.pages.dev/");</script>
</body>
</html>
